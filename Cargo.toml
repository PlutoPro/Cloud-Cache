[package]
name = "cloud-cache"
version = "0.1.0"
edition = "2021"
description = "Key-value store microservice with HTTP + TCP APIs, Keycloak (OIDC) auth, load-balancer friendly"

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
dashmap = "6"
futures = "0.3"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
base64 = "0.22"
rand = "0.8"
rsa = "0.9"

# RSA keygen in tests is painfully slow unoptimized
[profile.dev.package.num-bigint-dig]
opt-level = 3
